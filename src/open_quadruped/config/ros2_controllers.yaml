controller_manager:
  ros__parameters:
    update_rate: 1000
    enforce_command_limits: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    quadruped_controller:
      type: joint_trajectory_controller/JointTrajectoryController

gazebo_ros2_control:
  ros__parameters:
    pid_gains:
      position:
        motor_front_left_hip: {kp: 20.0, ki: 0.0, kd: 0.1, max_integral_error: 0.0}
        motor_front_left_upper_leg: {kp: 20.0, ki: 0.0, kd: 0.1, max_integral_error: 0.0}
        motor_front_left_lower_leg: {kp: 20.0, ki: 0.0, kd: 0.1, max_integral_error: 0.0}
        motor_front_right_hip: {kp: 20.0, ki: 0.0, kd: 0.1, max_integral_error: 0.0}
        motor_front_right_upper_leg: {kp: 20.0, ki: 0.0, kd: 0.1, max_integral_error: 0.0}
        motor_front_right_lower_leg: {kp: 20.0, ki: 0.0, kd: 0.1, max_integral_error: 0.0}
        motor_back_left_hip: {kp: 20.0, ki: 0.0, kd: 0.1, max_integral_error: 0.0}
        motor_back_left_upper_leg: {kp: 20.0, ki: 0.0, kd: 0.1, max_integral_error: 0.0}
        motor_back_left_lower_leg: {kp: 20.0, ki: 0.0, kd: 0.1, max_integral_error: 0.0}
        motor_back_right_hip: {kp: 20.0, ki: 0.0, kd: 0.1, max_integral_error: 0.0}
        motor_back_right_upper_leg: {kp: 20.0, ki: 0.0, kd: 0.1, max_integral_error: 0.0}
        motor_back_right_lower_leg: {kp: 20.0, ki: 0.0, kd: 0.1, max_integral_error: 0.0}

quadruped_controller:
  ros__parameters:
    joints:
      - motor_front_left_hip
      - motor_front_left_upper_leg
      - motor_front_left_lower_leg
      - motor_front_right_hip
      - motor_front_right_upper_leg
      - motor_front_right_lower_leg
      - motor_back_left_hip
      - motor_back_left_upper_leg
      - motor_back_left_lower_leg
      - motor_back_right_hip
      - motor_back_right_upper_leg
      - motor_back_right_lower_leg
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
